name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request with a focus on:
            - Correctness bugs
            - Security implications (this app sends email, stores SMTP credentials, and runs DB migrations)
            - Code quality, reuse and simplification opportunities
            - Performance considerations

            Note: The PR branch is already checked out in the current working directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

            After posting the review, decide whether to merge:
            - Run `gh pr diff --name-only` to list changed files.
            - If any changed file is under `Email_Management-main/backend/drizzle/`, or is a `.github/workflows/*.yml` file, or touches nginx/server deploy config: do NOT merge regardless of how clean the review is. Post a comment saying it needs a human to merge because it touches database migrations or deploy/CI config.
            - Otherwise, if you found no correctness bugs and no security issues (style or simplification suggestions alone do not block this), merge it with `gh pr merge --squash --delete-branch`.
            - If you found any correctness bug or security issue, do NOT merge; your comments should make clear what has to be fixed first.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr merge:*)"
