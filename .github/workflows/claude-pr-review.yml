name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            The PR branch is already checked out in the current working directory (not a merge ref — pushing here updates the PR directly).

            Step 1 — bring it up to date:
            Run `git fetch origin ${{ github.event.pull_request.base.ref }}` then `git merge origin/${{ github.event.pull_request.base.ref }}`.
            If this produces conflicts, resolve every one of them yourself by reading both sides and editing the files to the correct combined result — no matter how
            involved the conflict is, do not leave it unresolved and do not guess blindly; read enough surrounding code on both sides to know what each side was
            trying to do. When done: `git add -A`, then commit (configure `git config user.email "claude-pr-review@users.noreply.github.com"` and
            `git config user.name "Claude PR Review"` first if commit fails for missing identity), then `git push`.

            Step 2 — review the diff against ${{ github.event.pull_request.base.ref }} for:
            - Correctness bugs
            - Security implications (this app sends email, stores SMTP credentials, and runs DB migrations)
            - Code quality, reuse and simplification opportunities
            - Performance considerations
            - If the PR adds or changes anything under `Email_Management-main/backend/drizzle/`: these run unattended in production on every merge to main
              (see `backend/scripts/apply-sql-migrations.ts` — it tracks by filename, runs each new file once, in a transaction). Every statement must be safe
              to run against a live database with existing data: `CREATE TABLE IF NOT EXISTS`, `ADD COLUMN IF NOT EXISTS`, `DO $$ ... EXCEPTION WHEN
              duplicate_object THEN NULL; END $$` around `ADD CONSTRAINT`, no bare `CREATE TABLE`/`ADD COLUMN`/`DROP`/`ALTER ... TYPE` that could fail or lose
              data on a non-empty table. If a migration isn't written that way, fix it yourself (make it idempotent) rather than just flagging it, the same way
              you'd fix a correctness bug.
            Use `gh pr comment` for top-level feedback and `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`) for specific lines.
            Only post GitHub comments - don't submit review text as messages.

            Step 3 — fix what you can:
            If you found a correctness bug, security issue, or an unsafe (non-idempotent) migration statement that you can fix with a reasonably confident,
            scoped change, fix it directly in the files, then `git add -A`, commit, and `git push`. Note in your PR comment what you changed and why. If a
            finding needs a product/business decision you can't make, or you are not confident the fix is correct, leave it as a comment instead of guessing.

            Step 4 — decide whether to merge:
            Run `gh pr diff --name-only` to list changed files (after your own commits, if any). Once you've resolved conflicts and fixed or confirmed there
            are no remaining correctness/security issues (including migration safety, per Step 2), merge it with `gh pr merge --squash --delete-branch`. Only
            skip merging if something remains that you genuinely could not resolve or fix yourself — say exactly what, and why, in your comment.

          claude_args: |
            --allowedTools "Read,Edit,Write,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr merge:*),Bash(git *)"
