# MailFlow - nginx snippet (N-01, N-03, F-14, N-05/N-06 nginx part).
#
# Not applied anywhere yet. Review, then merge into the server's config:
#   PART 1 goes in the http { } block (maps must be at http level, e.g. /etc/nginx/conf.d/mailflow_maps.conf).
#   PART 2 replaces/merges into the existing server { } block for the MailFlow domain.
# Then: sudo nginx -t && sudo systemctl reload nginx   (test checklist: deploy/nginx_mailflow_checklist.md)
#
# PLACEHOLDERS to adjust:
#   server_name            -> the real domain (QA used email.deltaprimeaisolutions.com)
#   root                   -> folder of the web build. `npm run build` in web/ writes to web/src/dist
#                             (vite.config.ts has root: 'src'), so point root at wherever that folder is deployed.
#   upstream mailflow_backend -> address of the Express API (backend/src/index.ts listens on port 3000)
#   listen / ssl_*         -> keep the existing TLS lines of the current server block.
#
# Backend paths that must reach Express (not the SPA):
#   /api/*            all API routes, incl. /api/public/track, /api/public/forms/:key/submit, /api/unsubscribe,
#                     /api/track/open, Stripe webhook /api/payment/webhook
#   /t.js /f.js       website tracking + form embed scripts (loaded on customers' sites)
#   /f/<formKey>      hosted forms (embedded in an iframe on customers' sites -> must stay frameable)

# ============================== PART 1: http { } level ==============================

upstream mailflow_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# 1 = request is answered by the Express backend. Express already sends its own security headers there
# (backend/src/index.ts, N-05), so nginx adds none to those responses (no duplicates, /f/* stays frameable).
map $uri $mf_backend {
    default     0;
    ~^/api/     1;
    ~^/f/       1;
    /t.js       1;
    /f.js       1;
}

# N-03: hashed build files are immutable; index.html (and every SPA route that serves it) must revalidate
# so a new deploy is picked up at once. Empty value = header not added (backend decides its own caching).
map $uri $mf_cache_control {
    default     "no-cache";
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "";
    ~^/f/       "";
    /t.js       "";
    /f.js       "";
}

# N-05: the same headers Express sends, for the responses nginx serves itself (SPA html, assets, robots, 404).
map $mf_backend $mf_xcto        { 1 ""; default "nosniff"; }
map $mf_backend $mf_referrer    { 1 ""; default "strict-origin-when-cross-origin"; }
map $mf_backend $mf_xfo         { 1 ""; default "DENY"; }
map $mf_backend $mf_csp         { 1 ""; default "frame-ancestors 'none'"; }
map $mf_backend $mf_hsts        { 1 ""; default "max-age=31536000; includeSubDomains"; }

# ============================== PART 2: server { } ==============================

server {
    # --- keep the existing listen / ssl_certificate / ssl_certificate_key lines here ---
    # listen 443 ssl http2;
    server_name email.deltaprimeaisolutions.com;              # PLACEHOLDER

    root /var/www/mailflow/web/dist;                           # PLACEHOLDER: deployed web/src/dist
    index index.html;

    # --- N-06: no nginx version in the Server header or error pages ---
    server_tokens off;
    proxy_hide_header X-Powered-By;                            # Express already disables it; belt and braces

    # --- N-01: compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;                                          # also compress API JSON coming from Express
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml;
    # text/html is always compressed when gzip is on; it must not be listed again.

    # Brotli: only if the ngx_brotli module is installed (check: nginx -V 2>&1 | grep -o brotli).
    # It also needs `load_module modules/ngx_http_brotli_filter_module.so;` at the very top of nginx.conf.
    # brotli on;
    # brotli_comp_level 5;
    # brotli_min_length 1024;
    # brotli_types text/css application/javascript text/javascript application/json image/svg+xml text/plain application/xml text/html;

    # --- N-03 + N-05: one place for headers (variables are empty for backend paths -> header not sent) ---
    # `always` = also on 404 responses. No location below uses add_header, so these are inherited everywhere.
    add_header Cache-Control             $mf_cache_control always;
    add_header X-Content-Type-Options    $mf_xcto          always;
    add_header Referrer-Policy           $mf_referrer      always;
    add_header X-Frame-Options           $mf_xfo           always;
    add_header Content-Security-Policy   $mf_csp           always;
    add_header Strict-Transport-Security $mf_hsts          always;   # only if this server block is HTTPS

    # ---------------- Backend (Express) ----------------
    # Shared proxy settings. X-Forwarded-For is OVERWRITTEN with the real client address: the login/forgot-
    # password throttle (SEC-01/SEC-02) reads the first X-Forwarded-For value, so appending to a client-sent
    # header ($proxy_add_x_forwarded_for) would let anyone bypass it. If a CDN/load balancer sits in front of
    # nginx, set real_ip_header/set_real_ip_from for it first so $remote_addr is the visitor.
    location ^~ /api/ {
        proxy_pass http://mailflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;                              # recipient CSV/Excel uploads (multer has no limit)
        proxy_read_timeout 120s;
    }

    location = /t.js {
        proxy_pass http://mailflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /f.js {
        proxy_pass http://mailflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hosted forms: frameable on customers' sites (no X-Frame-Options / frame-ancestors from nginx).
    location ^~ /f/ {
        proxy_pass http://mailflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------- Static web app ----------------
    # Hashed build files. A missing file is a plain 404 (never index.html), so a stale chunk after a deploy
    # fails clearly instead of loading HTML as JavaScript.
    location ^~ /assets/ {
        try_files $uri =404;
        access_log off;
    }

    # F-14: a real robots.txt. Public pages (pricing, login) may be indexed; the API, hosted forms and every
    # logged-in page may not. "Disallow: /$" (the dashboard root) is understood by Google and Bing.
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /packages\nAllow: /login\nDisallow: /$\nDisallow: /api/\nDisallow: /f/\nDisallow: /campaigns\nDisallow: /follow-ups\nDisallow: /analytics\nDisallow: /inbox\nDisallow: /crm\nDisallow: /agent\nDisallow: /settings\nDisallow: /admin\nDisallow: /help\nDisallow: /checkout\nDisallow: /forgot-password\nDisallow: /reset-password\nDisallow: /signup\n";
    }

    # F-14: there is no sitemap; answer 404 instead of the SPA page.
    location = /sitemap.xml {
        return 404;
    }

    # SPA entry. Served for "/" and for every real frontend route below (no-cache via the map above).
    location = /index.html {
        try_files /index.html =404;
    }
    location = / {
        try_files /index.html =404;
    }

    # F-14: the real frontend routes from web/src/App.tsx (trailing slash allowed; query strings are not part of
    # the match). Keep this list in sync when a route is added to App.tsx.
    #   /login /signup /packages /checkout/success /forgot-password /reset-password /help
    #   /campaigns /campaigns/create /campaigns/:id /campaigns/:id/edit /follow-ups /follow-ups/schedule
    #   /analytics /inbox /crm /crm/pipelines /crm/leads /crm/forms /crm/forms/:id /agent /settings /admin/users
    # ":id" segments accept any single segment: the app itself shows "Campaign not found" for /campaigns/abc (U-17).
    location ~ "^/(login|signup|packages|checkout/success|forgot-password|reset-password|help|campaigns(/create|/[^/]+(/edit)?)?|follow-ups(/schedule)?|analytics|inbox|crm(/pipelines|/leads|/forms(/[^/]+)?)?|agent|settings|admin/users)/?$" {
        try_files /index.html =404;
    }

    # F-14: everything else is a real 404. The body is the SPA (it renders its "Page not found" screen), but the
    # status stays 404 because error_page is used without "=".
    location / {
        error_page 404 /index.html;
        return 404;
    }
}
